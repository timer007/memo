<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>メモ</title>
  <style>
    body { font-family: sans-serif; padding: 15px; background-color: #f4f4f4; }
    .memo-row { display: flex; gap: 8px; margin-bottom: 8px; }
    
    /* 3桁〜5桁用（短い入力欄） */
    .id-input { width: 75px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
    
    /* メモ内容用（広い入力欄） */
    .text-input { flex-grow: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    
    .save-btn { width: 100%; padding: 10px; font-weight: bold; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <button class="save-btn" onclick="saveAllMemos()">すべて保存</button>

  <!-- 20個の枠を配置する場所 -->
  <div id="memoContainer"></div>

  <script>
    const TOTAL_MEMOS = 20;

    window.onload = function() {
      const container = document.getElementById('memoContainer');
      const savedData = JSON.parse(localStorage.getItem('my_20_memos')) || [];

      for (let i = 0; i < TOTAL_MEMOS; i++) {
        const row = document.createElement('div');
        row.className = 'memo-row';
        
        // ID用入力欄（3〜5桁想定）
        const idInput = document.createElement('input');
        idInput.type = 'text';
        idInput.className = 'id-input';
        idInput.placeholder = 'ID';
        idInput.maxLength = 5; // 最大5桁に制限
        idInput.id = `id_${i}`;
        idInput.value = savedData[i] ? savedData[i].id : '';

        // メモ用入力欄
        const textInput = document.createElement('input');
        textInput.type = 'text';
        textInput.className = 'text-input';
        textInput.placeholder = 'メモ...';
        textInput.id = `text_${i}`;
        textInput.value = savedData[i] ? savedData[i].text : '';

        row.appendChild(idInput);
        row.appendChild(textInput);
        container.appendChild(row);
      }
    };

    function saveAllMemos() {
      const memoList = [];
      for (let i = 0; i < TOTAL_MEMOS; i++) {
        const idVal = document.getElementById(`id_${i}`).value;
        const textVal = document.getElementById(`text_${i}`).value;
        memoList.push({ id: idVal, text: textVal });
      }
      
      localStorage.setItem('my_20_memos', JSON.stringify(memoList));
      alert('保存しました！');
    }
  </script>

</body>
</html>
