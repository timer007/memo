<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5桁ID & メモ管理 (10+10)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #e9ecef;
      color: #333;
      padding: 6px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1px; /* 行と行の間を 1px に削る */
    }
    .memo-row {
      display: flex;
      gap: 4px;
      background: #fff;
      padding: 2px 4px; /* 行自体の上下左右の余白を最小限まで削る */
      align-items: center;
    }
    .id-input {
      width: 75px;
      height: 28px; /* 入力枠の高さをコンパクト化 */
      font-size: 0.95rem;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
      border: 1px solid #ccc;
      border-radius: 3px;
      outline: none;
    }
    .id-input:focus {
      border-color: #007bff;
      background-color: #f0f7ff;
    }
    .memo-input {
      flex: 1;
      height: 28px; /* 入力枠の高さをコンパクト化 */
      padding: 0 8px;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      outline: none;
    }
    .memo-input:focus {
      border-color: #007bff;
      background-color: #f0f7ff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="list"></div>
  </div>

  <script>
    const TOTAL_ROWS = 20; // 10 + 10 = 計20枠
    const listContainer = document.getElementById('list');

    for (let i = 0; i < TOTAL_ROWS; i++) {
      const row = document.createElement('div');
      row.className = 'memo-row';

      // 左側: 5桁入力枠
      const idInput = document.createElement('input');
      idInput.type = 'text';
      idInput.className = 'id-input';
      idInput.maxLength = 5;
      idInput.placeholder = '00000';
      idInput.value = localStorage.getItem(`id_${i}`) || '';
      idInput.addEventListener('input', (e) => {
        localStorage.setItem(`id_${i}`, e.target.value);
      });

      // 右側: 余白全体を使ったメモ枠
      const memoInput = document.createElement('input');
      memoInput.type = 'text';
      memoInput.className = 'memo-input';
      memoInput.placeholder = `メモ (${i + 1})`;
      memoInput.value = localStorage.getItem(`memo_${i}`) || '';
      memoInput.addEventListener('input', (e) => {
        localStorage.setItem(`memo_${i}`, e.target.value);
      });

      row.appendChild(idInput);
      row.appendChild(memoInput);
      listContainer.appendChild(row);
    }
  </script>
</body>
</html>
